databases:
  - name: payment-intelligence-db
    plan: free
    databaseName: payment_intelligence
    user: payment
    ipAllowList: []

services:
  - type: web
    name: payment-intelligence
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payment-intelligence-db
          property: connectionString
  - type: web
    name: payment-intelligence-dashboard
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payment-intelligence-db
          property: connectionString
